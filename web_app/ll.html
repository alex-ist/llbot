<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Lingo Link</title>
        <meta content="width=device-width, initial-scale=1" name="viewport"/>
        <link href="ll.css?ver=58" rel="stylesheet" type="text/css"/>
        <link href="https://fonts.googleapis.com" rel="preconnect"/>
        <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous"/>
        <link href="img/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
        <link href="img/webclip.png" rel="apple-toFrom mIreeuch-icon"/>
    </head>
    <body>
        <div class="container" id="container">
            <div class="blk1">
                <div class="speaker">                    
                    <div class="speaker-e"><img src="img/sp-e1.png" width="52" alt=""/></div>
                    <div class="speaker-d"><img src="img/sp-d1.png" width="52" alt=""/></div>
                </div>
                <div class="counter">
                    <div class="txt-counter">0</div>
                </div>
            </div>
            <div class="blk2">
                <div class="info-msg"></div>
            </div>
            <div class="blk3" id="flashContainer"> 
                <div class="flash" id="flash0">
                    <div class="loading"><span class="dot"></span> Loading...</div>
                    <div class="front">
                        <div class="corner-box corner-box-left">забыл</div>                    
                        <div class="corner-box corner-box-right">знаю</div>

                        <div class="f-and-s">
                            <div class="foreign">
                                <div class="fw-row">
                                    <div class="f-left">
                                        <img src="img/play.png" alt="" width="36" onclick="playAudio('fw');"/>
                                    </div>
                                    <a class="foreign-text" href="#" target="_blank">
                                        <span class="dot"></span> Loading...
                                    </a>
                                    <div class="spacer"></div>
                                </div>
                                <div class="pos-text">noun</div>
                            </div>
                            <div class="native">
                                <div class="native-text"></div>
                            </div>
                        </div>
                        <div class="example">
                            <div class="t-left">
                                <img src="img/play.png" width="36" alt="" onclick="playAudio('ex');"/>
                            </div>
                            <div class="example-text"></div>
                        </div>

                        <div class="q-text">??</div>
                    </div>
                    <div class="back">
                        <div class="corner-box corner-box-left">забыл</div>                    
                        <div class="corner-box corner-box-right">знаю</div>
                        <div class="f-and-s">
                            <div class="foreign">
                                <div class="fw-row">
                                    <div class="f-left">
                                        <img src="img/play.png" alt="" width="36" onclick="playAudio('fw');"/>
                                    </div>
                                    <a class="foreign-text" href="#" target="_blank">..loading</a>
                                    <div class="spacer"></div>
                                </div>
                                <div class="pos-text">noun</div>
                            </div>
                            <div class="back-native">
                                <div class="native-text"></div>
                            </div>
                        </div>
                        <div class="example">
                            <div class="t-left">
                                <img src="img/play.png" width="36" alt="" onclick="playAudio('ex');"/>
                            </div>
                            <div class="example-text">
                                <span class="ex ex-native">Перевод на русский</span>
                                <span class="ex ex-foreign">Example in foreign language</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="blk4">
                <div class="micbut">
                    <img src="img/micbut0.png" width="73" alt="" onclick="micbut_click()"/></div>
            </div>
        </div>
    </body>
    <script src="https://hammerjs.github.io/dist/hammer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="ll.js?ver=58"></script>
</html>
