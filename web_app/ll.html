<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Lingo Link</title>
        <meta content="width=device-width, initial-scale=1" name="viewport"/>
        <link href="ll.css?ver=18" rel="stylesheet" type="text/css"/>
        <link href="https://fonts.googleapis.com" rel="preconnect"/>
        <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous"/>
        <link href="img/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
        <link href="img/webclip.png" rel="apple-touch-icon"/>
    </head>
    <body>
        <img src="img/l1.png" srcset="img/l1.png 2x" class="bg-image1">
        <img src="img/l2.png" srcset="img/l2.png 2x" class="bg-image2">
        <img src="img/l3.png" srcset="img/l3.png 2x" class="bg-image3">
        <img src="img/l4.png" srcset="img/l4.png 2x" class="bg-image4">
        <img src="img/l5.png" srcset="img/l5.png 2x" class="bg-image5">
        <img src="img/l3.png" srcset="img/l3.png 2x" class="bg-image6">
        <div class="container" id="container">
            <div class="hdr">
                <div class="speaker">                    
                    <div class="speaker-e"><img src="img/sp-e.png" width="34" alt=""/></div>
                    <div class="speaker-d"><img src="img/sp-d.png" width="34" alt=""/></div>
                </div>
                <div class="counter">
                    <div class="txt-counter">0</div>
                </div>
            </div>
            <div class="middle"></div>
            <div class="perspective-container"> 
                <div class="flash" id="flash0">
                    <div class="front">
                        <div class="corner-box corner-box-left">забыл</div>                    
                        <div class="corner-box corner-box-right">знаю</div>
                            <div class="foreign">
                            <div class="f-left">
                                <img src="img/play.png" alt="" width="36" onclick="playAudio('fw');"/>
                            </div>
                            <div class="foreign-text">...</div>
                            <div class="spacer"></div>
                        </div>
                        <div class="native">
                            <div class="native-text">...</div>
                        </div>
                        <div class="q-text">??</div>
                    </div>
                    <div class="back">
                        <div class="corner-box corner-box-left">забыл</div>                    
                        <div class="corner-box corner-box-right">знаю</div>
                        <div class="f-and-s">
                            <div class="foreign">
                                <div class="f-left">
                                    <img src="img/play.png" alt="" width="36" onclick="playAudio('fw');"/>
                                </div>
                                <a class="foreign-text" href="https://dictionary.cambridge.org/dictionary/english/smell" target="_blank">[foreign word]</a>
                                <div class="spacer"></div>
                            </div>
                            <div class="back-native">
                                <div class="native-text">[native word]</div>
                            </div>
                        </div>
                        <div class="back-example">
                            <div class="t-left">
                                <img src="img/play.png" width="28" alt="" onclick="playAudio('ex');"/>
                            </div>
                            <div class="example-text">[exemple]</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="https://hammerjs.github.io/dist/hammer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="ll.js?ver=18"></script>
</html>
