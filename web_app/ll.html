<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Lingo Link</title>
        <meta content="width=device-width, initial-scale=1" name="viewport"/>
        <link href="ll.css" rel="stylesheet" type="text/css"/>
        <link href="https://fonts.googleapis.com" rel="preconnect"/>
        <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous"/>
        <link href="img/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
        <link href="img/webclip.png" rel="apple-touch-icon"/>
    </head>
    <body class="body">
        <div class="container" id="container">
            <div class="hdr">
                <div class="speaker">
                    <img src="img/sp.png" width="34" alt=""/>
                </div>
                <div class="counter">
                    <div class="txt-counter">16</div>
                </div>
            </div>
            <div class="middle"></div>
            <div class="flash" id="flash0">
                <div class="f-and-s">
                    <div class="first">
                        <div class="f-left">
                            <img src="img/play.png" alt="" width="36"/>
                        </div>
                        <div class="f-text">[foreign word]</div>
                        <div class="spacer"></div>
                    </div>
                    <div class="second">
                        <div class="s-text">[native word]</div>
                    </div>
                </div>
                <div class="third">
                    <div class="t-left">
                        <img src="img/play.png" width="28" alt=""/>
                    </div>
                    <div class="t-text">[exemple]</div>
                </div>
            </div>
            <div class="flash" id="flash1">
                <div class="f-and-s">
                    <div class="first">
                        <div class="f-left">
                            <img src="img/play.png" alt="" width="36"/>
                        </div>
                        <div class="f-text">[foreign word]</div>
                        <div class="spacer"></div>
                    </div>
                    <div class="second">
                        <div class="s-text">[native word]</div>
                    </div>
                </div>
                <div class="third">
                    <div class="t-left">
                        <img src="img/play.png" width="28" alt=""/>
                    </div>
                    <div class="t-text">[exemple]</div>
                </div>
            </div>
        </div>
    </body>
    <script src="https://hammerjs.github.io/dist/hammer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="ll.js"></script>
</html>
